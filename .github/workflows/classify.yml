name: Update public YouTube classifications
on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: public-youtube-classification
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install helper dependency
        run: python -m pip install -r requirements.txt
      - name: Read public tabs
        run: python classify.py --limit 500 --output classification.json
      - name: Save refreshed public classifications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add classification.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public channel classifications'
          git push
